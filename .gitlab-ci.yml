stages:
  - build
  - push
  - restart
  - test
  - lint


variables:
  GIT_STRATEGY: clone
  CONTAINER_URL: "${NDIP_DOCKER_REPOSITORY}/${CI_PROJECT_PATH}"

# This import is for the func_rse_docker_* functions
before_script:
  - curl https://code.ornl.gov/rse-deployment/rse-sharables/raw/master/rse-bash-modules.sh -O
  - docker login -u $NDIP_DOCKER_USER -p $NDIP_DOCKER_PASSWORD $NDIP_DOCKER_REPOSITORY
  - source rse-bash-modules.sh
  - func_rse_docker_cleanup

after_script:
  - curl https://code.ornl.gov/rse-deployment/rse-sharables/raw/master/rse-bash-modules.sh -O
  - source rse-bash-modules.sh
  - func_rse_docker_cleanup
  - sudo chown -R gitlab-runner .

service-build:
  stage: build
  script:
    - >
      docker build
      -f dockerfiles/Dockerfile
      -t galaxy_tools .
    - docker tag galaxy_tools $CONTAINER_URL:prototype
    - docker push $CONTAINER_URL:prototype
  when: manual
  tags:
    - rse-multi-builder

push_dev_tools:
  stage: push
  script:
    - echo "$PULSAR_SSH_KEY" > key
    - chmod 400 key
    - >
      rsync -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key"
      --rsync-path "sudo rsync" -rv --delete
      tools/neutrons/ cloud@ndip-dev.ornl.gov:/srv/galaxy/local_tools/neutrons-dev/
    - >
      ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key
      cloud@ndip-dev.ornl.gov
      mkdir -p /tmp/radar-pd-datatype
    - >
      rsync -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key"
      -rv
      tool_data/radar_pd_datatypes_conf.xml.sample
      utils/register_radar_pd_datatype.py
      cloud@ndip-dev.ornl.gov:/tmp/radar-pd-datatype/
    - >
      ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key
      cloud@ndip-dev.ornl.gov
      'config_file="";
      for candidate in
      /srv/galaxy/var/config/datatypes_conf.xml
      /srv/galaxy/config/datatypes_conf.xml
      /srv/galaxy/server/config/datatypes_conf.xml
      /srv/galaxy/var/config/datatypes_conf.xml.sample
      /srv/galaxy/config/datatypes_conf.xml.sample
      /srv/galaxy/server/config/datatypes_conf.xml.sample;
      do if sudo test -f "$candidate"; then config_file="$candidate"; break; fi; done;
      if test -z "$config_file"; then
      config_file=$(sudo find /srv/galaxy -maxdepth 5 -type f
      \( -name "datatypes_conf.xml" -o -name "datatypes_conf.xml.sample" \)
      -print -quit); fi;
      if test -z "$config_file"; then echo "Galaxy datatype configuration was not found" >&2; exit 1; fi;
      echo "Registering RADAR-PD GPX in $config_file";
      sudo python3 /tmp/radar-pd-datatype/register_radar_pd_datatype.py
      --config "$config_file"
      --fragment /tmp/radar-pd-datatype/radar_pd_datatypes_conf.xml.sample'
    - >
      ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key
      cloud@ndip-dev.ornl.gov
      sudo /root/update_prototype_tools.sh
      /srv/galaxy/local_tools/neutrons-dev
      /srv/galaxy/config/tool_conf_prototype.xml
    - >
      ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i key
      cloud@ndip-dev.ornl.gov
      'echo "NDIP deployment host capabilities";
      printf "user_kubectl="; command -v kubectl || echo absent;
      printf "root_kubectl="; sudo -n sh -c "command -v kubectl" || echo absent;
      for candidate in
      /home/cloud/.kube/config
      /root/.kube/config
      /etc/rancher/k3s/k3s.yaml
      /etc/rancher/rke2/rke2.yaml;
      do if sudo -n test -f "$candidate"; then echo "kubeconfig_present=$candidate"; fi; done;
      for command_name in kubectl rollout restart reload systemctl docker podman;
      do if sudo -n grep -q "$command_name" /root/update_prototype_tools.sh;
      then echo "update_script_uses=$command_name"; fi; done;
      sudo -n systemctl list-unit-files --type=service 2>/dev/null
      | grep -i galaxy || true'
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "prototype"
      changes:
        - ".gitlab-ci.yml"
        - "tools/neutrons/**/*"
        - "tool_data/radar_pd_datatypes_conf.xml.sample"
        - "utils/register_radar_pd_datatype.py"
      when: always
    - when: never
  tags:
    - rse-multi-builder

redeploy_k8s_galaxy:
  stage: restart
  variables:
    KUBE_NAMESPACE: ndip
    GALAXY_DEPLOYMENT: galaxy
    GALAXY_ROLLOUT_TIMEOUT: 300s
    GALAXY_INIT_GIT_IMAGE: regproxy.ornl.gov/hub_proxy/alpine/git:latest
    KUBECTL_IMAGE: regproxy.ornl.gov/hub_proxy/bitnami/kubectl:latest
    KUBECTL_VERSION: v1.36.4
    KUBECTL_SHA256: 8b8f088da2dab964f853b38464033b1be15ede2839eca751482357c45abdd05a
  before_script: []
  after_script: []
  script:
    - echo "$KUBECONFIG" | base64 -d > kubeconfig
    - |
      if command -v kubectl >/dev/null 2>&1; then
        echo "Using kubectl already installed on the deployment runner"
        run_kubectl() { KUBECONFIG="$PWD/kubeconfig" kubectl "$@"; }
      else
        pull_succeeded=0
        for attempt in 1 2; do
          if docker pull "$KUBECTL_IMAGE"; then
            pull_succeeded=1
            break
          fi
          if test "$attempt" -lt 2; then
            echo "kubectl image pull attempt ${attempt} failed; retrying in 10 seconds"
            sleep 10
          fi
        done

        if test "$pull_succeeded" -eq 1; then
          run_kubectl() {
            docker run --rm --pull=never -u root:root \
              -v "$PWD":/mnt -e KUBECONFIG=/mnt/kubeconfig \
              "$KUBECTL_IMAGE" "$@"
          }
        else
          echo "The internal registry is unavailable; downloading the pinned kubectl release"
          curl --fail --location --retry 4 --retry-delay 5 \
            --output kubectl \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  kubectl" | sha256sum --check --strict
          chmod 0755 kubectl
          run_kubectl() { KUBECONFIG="$PWD/kubeconfig" ./kubectl "$@"; }
        fi
      fi

      run_kubectl get deployment galaxy -n ndip -o json > galaxy-deployment.json
      init_name=$(python3 -c '
      import json
      import sys
      deployment = json.load(open("galaxy-deployment.json", encoding="utf-8"))
      containers = deployment["spec"]["template"]["spec"].get("initContainers", [])
      print(next((item["name"] for item in containers if item.get("image") == sys.argv[1]), ""))
      ' "$GALAXY_INIT_GIT_IMAGE")
      if test -n "$init_name"; then
        init_policy=$(python3 -c '
      import json
      import sys
      deployment = json.load(open("galaxy-deployment.json", encoding="utf-8"))
      containers = deployment["spec"]["template"]["spec"].get("initContainers", [])
      print(next((item.get("imagePullPolicy", "") for item in containers if item.get("name") == sys.argv[1]), ""))
      ' "$init_name")
        echo "Galaxy init container ${init_name} uses ${GALAXY_INIT_GIT_IMAGE} with policy ${init_policy:-default}"
        if test "$init_policy" != "IfNotPresent"; then
          patch=$(python3 -c '
      import json
      import sys
      print(json.dumps({"spec": {"template": {"spec": {"initContainers": [{"name": sys.argv[1], "imagePullPolicy": "IfNotPresent"}]}}}}))
      ' "$init_name")
          run_kubectl patch deployment galaxy -n ndip --type=strategic -p "$patch"
        fi
      fi

      run_kubectl rollout restart deployment/galaxy -n ndip
      if ! run_kubectl rollout status deployment/galaxy -n ndip \
        --timeout="$GALAXY_ROLLOUT_TIMEOUT"; then
        echo "Galaxy rollout did not complete; collecting cluster diagnostics"
        run_kubectl get deployment galaxy -n ndip -o wide || true
        run_kubectl get pods -n ndip -o wide || true
        run_kubectl get events -n ndip --sort-by=.lastTimestamp | tail -80 || true
        exit 1
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "prototype"
      changes:
        - ".gitlab-ci.yml"
        - "tools/neutrons/**/*"
        - "tool_data/radar_pd_datatypes_conf.xml.sample"
        - "utils/register_radar_pd_datatype.py"
      when: always
    - when: never
  tags:
    - rse-multi-builder
lint-xml:
  stage: lint
  script:
    - docker build -f dockerfiles/Dockerfile.linter -t tool_linter .
    - docker run --rm -v $PWD:/reports -u `id -u`:`id -g` tool_linter pytest --junitxml=/reports/report.xml
  allow_failure: true
  when: manual
  artifacts:
    when: always
    reports:
      junit: report.xml
  tags:
    - rse-multi-builder

testing:
  stage: test
  script:
    - sudo apt-get install -y libxml2-utils
    - echo Before SHA $CI_COMMIT_BEFORE_SHA
    - echo After SHA $CI_COMMIT_SHA
    - git fetch --unshallow
    - CHANGED_FILES=$(git diff --diff-filter=AM --name-only $CI_COMMIT_BEFORE_SHA $CI_COMMIT_SHA -- "*.xml" | tr '\n' ' ')
    - files_with_test=""
    - |
      for file in $CHANGED_FILES; do
          # Check if the file has tests
          if xmllint --xpath "//*[local-name()='test']" "$file" | grep -q "<test>" ; then
              files_with_test="$files_with_test $file"
          fi
      done
    - |
      if [ -z "$files_with_test" ]; then
        echo "No tools with tests have changed, so no tests will run."
        touch $(pwd)/junit_output.xml
      else
          echo "will execute tests for $files_with_test"
          docker run -v `pwd`:/`pwd` \
                     -u `id -u`:`id -g` \
                     --workdir `pwd` \
                      $CONTAINER_URL:prototype planemo test --galaxy_root /galaxy --docker --no_conda_auto_init --test_output_junit `pwd`/junit_output.xml --galaxy_url https://calvera-test.ornl.gov --galaxy_user_key $CALVERA_TEST_API_KEY --galaxy_admin_key $CALVERA_TEST_ADMIN_KEY $files_with_test
      fi
  artifacts:
    reports:
      junit: junit_output.xml
    when: on_success
  tags:
    - rse-multi-builder
