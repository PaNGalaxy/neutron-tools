class: GalaxyWorkflow
label: RADAR-PD - Build Custom Library and Analyze
doc: Build a mini CIF catalog and use it in one uploaded-data RADAR-PD job.
inputs:
  candidate_cifs:
    type: collection
    collection_type: list
  configuration:
    type: data
  diffraction_data:
    type: data
  instrument_profile:
    type: data
  main_phase_cif:
    type: data
    optional: true
steps:
  build_library:
    tool_id: neutrons_radar_pd_library_builder_prototype
    state:
      library_mode: mini
      radiation: neutron
      overwrite: false
    in:
      cif_files:
        source: candidate_cifs
  analyze:
    tool_id: neutrons_radar_pd_analyze_prototype
    state:
      input_source:
        source_kind: history
        instrument_source:
          instrument_kind: upload
      configuration:
        config_kind: existing
      database:
        database_kind: custom
    in:
      input_source|data:
        source: diffraction_data
      input_source|instrument_source|instrument:
        source: instrument_profile
      configuration|config_file:
        source: configuration
      main_cif:
        source: main_phase_cif
      database|database_archive:
        source: build_library/library_archive
outputs:
  library_archive:
    outputSource: build_library/library_archive
  report:
    outputSource: analyze/report
  summary:
    outputSource: analyze/summary
  plots:
    outputSource: analyze/plots
  gpx_projects:
    outputSource: analyze/gpx_projects
  results_archive:
    outputSource: analyze/results_archive
