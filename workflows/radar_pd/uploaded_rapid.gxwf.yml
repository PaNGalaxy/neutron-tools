class: GalaxyWorkflow
label: RADAR-PD - Uploaded Rapid Analysis
doc: Run Rapid Hypothesis Mode on datasets already uploaded to Galaxy history.
inputs:
  configuration:
    type: data
  diffraction_data:
    type: data
  instrument_profile:
    type: data
  main_phase_cif:
    type: data
    optional: true
steps:
  analyze:
    tool_id: neutrons_radar_pd_analyze_prototype
    state:
      input_source:
        source_kind: history
        instrument_source:
          instrument_kind: upload
      configuration:
        config_kind: existing
      database:
        database_kind: builtin
    in:
      input_source|data:
        source: diffraction_data
      input_source|instrument_source|instrument:
        source: instrument_profile
      configuration|config_file:
        source: configuration
      main_cif:
        source: main_phase_cif
outputs:
  report:
    outputSource: analyze/report
  summary:
    outputSource: analyze/summary
  plots:
    outputSource: analyze/plots
  tables:
    outputSource: analyze/tables
  phases:
    outputSource: analyze/phases
  gpx_projects:
    outputSource: analyze/gpx_projects
  results_archive:
    outputSource: analyze/results_archive
